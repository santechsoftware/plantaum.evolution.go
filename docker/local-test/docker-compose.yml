name: evogo-localtest

# Local A/B harness for the auth-pool leak fix.
#
#   evo-fixed      built from the working tree (has the pool fix)
#   evo-baseline   built from BASE_COMMIT, i.e. before the fix   [profile: ab]
#
# Both talk to the SAME Postgres but to their own auth/users databases, so
# `pg_stat_activity` can attribute every backend connection to one server.

x-evo-env: &evo-env
  SERVER_PORT: 8080
  CLIENT_NAME: evolution
  GLOBAL_API_KEY: ${GLOBAL_API_KEY:?set GLOBAL_API_KEY in docker/local-test/.env}
  DATABASE_SAVE_MESSAGES: "false"
  WADEBUG: ${WADEBUG:-INFO}
  LOGTYPE: console
  # Off by default: instances are connected explicitly by pool-leak-test.sh.
  # Flip to "true" to reproduce the boot-storm described in the fix commit.
  CONNECT_ON_STARTUP: ${CONNECT_ON_STARTUP:-false}
  MINIO_ENABLED: "false"
  AMQP_GLOBAL_ENABLED: "false"
  OS_NAME: Evolution GO Local Test

x-evo-common: &evo-common
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    container_name: evogo-lt-postgres
    # Roomy overall, because the interesting ceiling is per-role: init-db.sh caps
    # each server's own role at PG_ROLE_CONN_LIMIT, which the pre-fix leak
    # exhausts within a few dozen instances without touching the other server.
    command: ["postgres", "-c", "max_connections=${PG_MAX_CONNECTIONS:-200}"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PG_ROLE_CONN_LIMIT: ${PG_ROLE_CONN_LIMIT:-60}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 30

  evo-fixed:
    <<: *evo-common
    image: evogo-localtest:fixed
    container_name: evogo-lt-fixed
    ports:
      - "${FIXED_PORT:-8080}:8080"
    environment:
      <<: *evo-env
      POSTGRES_AUTH_DB: postgresql://evo_fixed:evo_fixed@postgres:5432/auth_fixed?sslmode=disable
      POSTGRES_USERS_DB: postgresql://evo_fixed:evo_fixed@postgres:5432/users_fixed?sslmode=disable

  evo-baseline:
    <<: *evo-common
    image: evogo-localtest:baseline
    container_name: evogo-lt-baseline
    profiles: ["ab"]
    ports:
      - "${BASELINE_PORT:-8081}:8080"
    environment:
      <<: *evo-env
      POSTGRES_AUTH_DB: postgresql://evo_baseline:evo_baseline@postgres:5432/auth_baseline?sslmode=disable
      POSTGRES_USERS_DB: postgresql://evo_baseline:evo_baseline@postgres:5432/users_baseline?sslmode=disable

volumes:
  pgdata:
